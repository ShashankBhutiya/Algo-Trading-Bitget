<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.65">
    <title>Login - AlgoBot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0b0e14;
            --bg-card: #181e29;
            --primary: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-subtle: #2d3748;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-subtle);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo {
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo i {
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            background-color: #0b0e14;
            border: 1px solid var(--border-subtle);
            border-radius: 0.5rem;
            color: #fff;
            box-sizing: border-box;
            /* Fix padding issue */
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .error {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-robot"></i> AlgoBot
        </div>
        <form id="login-form">
            <input type="password" id="password" placeholder="Enter Access Password" required>
            <button type="submit">Unlock Dashboard</button>
            <p id="error-msg" class="error">Invalid Password</p>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const btn = document.querySelector('button');
            const err = document.getElementById('error-msg');

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    err.style.display = 'block';
                    err.innerText = data.message || "Access Denied";
                    btn.disabled = false;
                    btn.innerText = "Unlock Dashboard";
                }
            } catch (e) {
                console.error(e);
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
